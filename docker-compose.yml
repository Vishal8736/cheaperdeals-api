# Cheape Deal stack: postgres + api (dashboard) + n8n (+ caddy for HTTPS on a VPS).
#   Local (Windows, Docker Desktop):  docker compose up -d --build
#   VPS with HTTPS:                   docker compose --profile prod up -d --build
name: cheapedeal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CONNECTORS_DIR: /connectors
    volumes:
      - ./connectors:/connectors   # drop connector files here (see connectors/README.md)
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # reachable from this machine only; the internet goes through Caddy

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest   # after your first successful boot, pin this to the exact version you tested
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_PORT: "5678"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${APP_TIMEZONE}
      TZ: ${APP_TIMEZONE}
      # the workflows read the key as {{ $env.CHEAPEDEAL_INTERNAL_KEY }}
      CHEAPEDEAL_INTERNAL_KEY: ${INTERNAL_API_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - n8n

volumes:
  pgdata:
  n8ndata:
  caddydata:
  caddyconfig:
